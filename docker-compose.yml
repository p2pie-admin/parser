version: "3.8"

services:
  parser:
    container_name: parser
    build:
      context: .
      dockerfile: Dockerfile
    image: darkshrine/parser:latest
    depends_on:
      - redis # Ensure Redis starts before the parser service
    environment:
      - REDIS_HOST=redis # Redis service hostname
      - REDIS_PORT=6379 # Redis default port
    deploy:
      resources:
        limits:
          cpus: "0.000" # Allow unrestricted CPU usage (Docker will dynamically allocate based on need)

  redis:
    container_name: redis
    image: redis:latest
    ports:
      - "6379:6379" # Expose Redis port
    volumes:
      - redis_data:/data # Persist Redis data to a Docker volume

volumes:
  redis_data:
    driver: local
